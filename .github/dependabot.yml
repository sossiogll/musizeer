# Dependency updates (https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file).
#
# Every pull request goes into dev, like any change (master takes pull requests from dev only), with the
# release label fix: merged into master, it makes a PATCH release by itself (ADR-0007 §6). Minor and
# patch updates come grouped, one pull request per ecosystem a week; a major update comes on its own,
# still labelled fix: relabel it breaking or feature if it changes what operators or users see.
#
# Security updates are raised against the repository's default branch, whatever target-branch says.
version: 2

updates:
  # The host: API, workers, migrations (the SDK and the gateway depend on nothing but the standard library).
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [fix]
    commit-message:
      prefix: deps
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # redis-py 6.5 and later are not supported by kombu (Celery's Redis transport): wait until it is.
      - dependency-name: redis
        update-types: [version-update:semver-major]
      # kombu 5.7.0 moved `packaging` into its `redis` extra while kombu.transport.redis still imports it: the
      # workers of the production image could not start (2026-11-04, pinned to 5.6.2). Celery 5.7 requires
      # kombu 5.7, so it waits too. Moving them is a change of its own: kombu[redis] in requirements.txt and
      # the "app image (production)" check green, never a weekly update.
      - dependency-name: kombu
        versions: [">=5.7.0"]
      - dependency-name: celery
        versions: [">=5.7.0"]

  # The web app (pnpm).
  - package-ecosystem: npm
    directory: /musizeer-ui
    target-branch: dev
    schedule:
      interval: weekly
    labels: [fix]
    commit-message:
      prefix: deps
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # The major of @types/node follows the Node the project runs (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The end-to-end suite (pnpm).
  - package-ecosystem: npm
    directory: /e2e
    target-branch: dev
    schedule:
      interval: weekly
    labels: [fix]
    commit-message:
      prefix: deps
    groups:
      e2e:
        update-types: [minor, patch]
    ignore:
      # @playwright/test must be the version of the image the suite runs in (mcr.microsoft.com/playwright:vX.Y.Z-noble
      # in e2e/run.sh and e2e/README.md), which Dependabot does not update: the two move together, by hand.
      - dependency-name: "@playwright/test"
      # The major of @types/node follows the Node of the Playwright image (22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The base images of the Musizeer images and of the providers' base image.
  - package-ecosystem: docker
    directories: [/, /gateway, /musizeer-ui, /provider-base]
    target-branch: dev
    schedule:
      interval: weekly
    labels: [fix]
    commit-message:
      prefix: deps
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # The Node of the images is a decision of its own and stays on an LTS (24), never a weekly update.
      - dependency-name: node
        update-types: [version-update:semver-minor, version-update:semver-major]
      # python:3.12 → 3.13 is a "minor" tag here but the Python every provider runs on (the base image):
      # moving it is a decision of its own, with the providers' tests, never a weekly update.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    labels: [fix]
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
